error_log   /var/log/nginx/error.log;
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m inactive=30d use_temp_path=off;

upstream django {
  least_conn;
  server web:8000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;

  server_name int.template_project.space;

  location / {
    return 302 https://$host$request_uri;
  }

  location /.well-known/acme-challenge/ {
    access_log off;
    root /var/www/certbot;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name int.template_project.space;
  server_tokens off;

  charset utf-8;
  client_max_body_size 128M;

  ssl_certificate /etc/letsencrypt/live/int.template_project.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/int.template_project.space/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/int.template_project.space/chain.pem;

  proxy_connect_timeout 60s;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  if ($host !~* ^(int.template_project.space)$) {
    return 404;
  }

  location /static/ {
    alias /staticfiles/;
    expires 30d;
    add_header Cache-Control "public, no-transform";

    proxy_cache static_cache;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;

    access_log off;
    log_not_found off;
  }

  location / {
    limit_req zone=req_limit_per_ip burst=10 nodelay;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_redirect off;
    proxy_cache_bypass  $http_x_requested_with=XMLHttpRequest;
    proxy_no_cache      $http_x_requested_with=XMLHttpRequest;
    proxy_pass http://django;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
