<div class="modal fade" id="cityAdminUpdateRequestModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark-blue">
                <h5 class="modal-title">Редактирование заявки</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span class="text-white" aria-hidden="true">&times;</span></button>
            </div>
            <form method="post" action="{% url 'service_request:request_city_admin_update' svc_request.pk %}"
                  autocomplete="off" id="cityAdminUpdateRequest">
                {% csrf_token %}
                <div class="modal-body" id="cityAdminUpdateRequestBody">
                    {% include 'service_request/block/city_admin_update_request_body.html' with form=city_admin_form %}
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success action-btn">
                        <i class="material-icons align-bottom">check</i> Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
