<div class="modal fade" id="confirmCancelModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark-blue">
                <h5 class="modal-title">Подтверждение отмены</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span class="text-white" aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body font-weight-bold">
                <p>Вы точно хотите отменить заявку #{{ svc_request.request_number }}?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal" aria-label="Close">Нет</button>
                <form method="post" action="{% url 'service_request:cancel_request' svc_request.pk %}"
                      style="display: inline;" autocomplete="off">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger action-btn">Да, отменить</button>
                </form>
            </div>
        </div>
    </div>
</div>
