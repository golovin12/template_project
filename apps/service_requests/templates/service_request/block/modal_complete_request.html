<div class="modal fade" id="completeRequestModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark-blue">
                <h5 class="modal-title">Завершение заявки</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span class="text-white" aria-hidden="true">&times;</span></button>
            </div>
            <form method="post" action="{% url 'service_request:complete_request' svc_request.pk %}" autocomplete="off"
                  enctype="multipart/form-data" id="completeRequest">
                {% csrf_token %}
                <div class="modal-body" id="completeRequestBody">
                    {% include 'service_request/block/complete_request_body.html' with closing_form=closing_form %}
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success action-btn">
                        <i class="material-icons align-bottom">check</i> Завершить заявку
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
