{% extends 'documents/base.html' %}
{% load bootstrap4 %}

{% block title %}Вход — Документы{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-7 col-xl-5">
            <div class="card shadow mb-4">
                <h3 class="card-header bg-dark-blue d-flex flex-wrap">Вход</h3>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {% bootstrap_form form %}
                        <button type="submit" class="btn btn-primary btn-block">Войти</button>
                    </form>
                </div>
                <div class="card-footer">
                    Нет аккаунта?
                    <a href="{% url 'documents:register' %}">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
