{% extends 'documents/base.html' %}
{% load bootstrap4 %}

{% block title %}Регистрация — Документы{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h3 class="mb-4">Регистрация</h3>

            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}
                <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
            </form>

            <p class="mt-3">
                Уже зарегистрированы?
                <a href="{% url 'documents:login' %}">Войти</a>
            </p>
        </div>
    </div>
{% endblock %}
