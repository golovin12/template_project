services:
  balancer:
    image: nginx:1.25
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - static_volume:/staticfiles:ro
      - ./int/management/configurations/nginx_settings_stage.conf:/etc/nginx/sites-enabled/nginx_settings.conf:ro
      - ./int/management/configurations/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./int/management/certs/fullchain.crt:/etc/ssl/private/fullchain.crt:ro
      - ./int/management/certs/server.key:/etc/ssl/private/server.key:ro
    depends_on:
      - web
    networks:
      - loadbalancing

  rabbitmq:
    image: rabbitmq:3.12.8-management
    command: rabbitmq-server
    restart: unless-stopped
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./int/management/configurations/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./int/management/configurations/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    hostname: rabbitmq
    networks:
      - local_network
    ports:
      - "15672:15672"
    expose:
      - 5672

  redis:
    image: redis:alpine
    command: redis-server --save 20 1 --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    hostname: redis
    volumes:
      - redis:/var/lib/redis
    networks:
      - local_network
    expose:
      - 6379

  pgdb:
    image: postgres:17
    restart: unless-stopped
    hostname: pgdb
    environment:
      - POSTGRES_DB=template_project_default
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdbdata:/var/lib/postgresql/data/
      - ./int/management/configurations/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - local_network
    expose:
      - 5432

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - local_network
    command: server /data
    expose:
      - 9000

  create_buckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb minio/091a0cc3-02303de7-8ec4-40c3-a350-3d5f8431bec4;
      /usr/bin/mc policy set private minio/091a0cc3-02303de7-8ec4-40c3-a350-3d5f8431bec4;
      echo 'Buckets created successfully';
      exit 0;
      "
    networks:
      - local_network

  web:
    build: .
    command: >
      bash -c "python manage.py create_databases
      && python manage.py migrate --database=default
      && python manage.py migrate --database=organization_1
      && python manage.py migrate --database=organization_2
      && echo yes | python manage.py collectstatic
      && uvicorn int.asgi_stage:application --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      - DJANGO_SETTINGS_MODULE=int.settings_stage
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - redis
      - pgdb
      - minio
    volumes:
      - static_volume:/staticfiles
    networks:
      - local_network
      - loadbalancing
    expose:
      - 8000

  scheduler:
    build: .
    command: python manage.py scheduler
    environment:
      - DJANGO_SETTINGS_MODULE=int.settings_stage
    restart: unless-stopped
    depends_on:
      - web
      - rabbitmq
      - redis
      - pgdb
    networks:
      - local_network

  worker:
    build: .
    command: python manage.py rundramatiq --processes 2 --threads 1 --queues holding_connection backup notifications default
    environment:
      - DJANGO_SETTINGS_MODULE=int.settings_stage
    restart: unless-stopped
    depends_on:
      - web
      - rabbitmq
      - redis
      - pgdb
    networks:
      - local_network

  notifications_worker:
    build: .
    command: python manage.py rundramatiq --processes 1 --threads 1 --queues notifications_queue
    environment:
      - DJANGO_SETTINGS_MODULE=int.settings_stage
    restart: unless-stopped
    depends_on:
      - web
      - rabbitmq
      - redis
      - pgdb
    networks:
      - local_network

volumes:
  static_volume:
  pgdbdata:
  minio_data:
  rabbitmq:
  redis:

networks:
  local_network:
  loadbalancing:
