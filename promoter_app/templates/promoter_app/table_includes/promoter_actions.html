<div class="btn-group btn-group-sm">
    <button class="btn btn-outline-primary js-show-qr" data-url="{% url 'promoter_app:promoter_qr' record.id %}"
            title="QR авторизации">
        <i class="material-icons">qr_code</i>
    </button>

    <button class="btn btn-outline-secondary js-edit-promoter" title="Редактировать"
            data-url="{% url 'promoter_app:promoter_edit' record.id %}" data-nickname="{{ record.nickname }}">
        <i class="material-icons">edit</i>
    </button>

    <button class="btn btn-outline-warning js-logout-promoter" data-nickname="{{ record.nickname }}"
            data-url="{% url 'promoter_app:promoter_logout' record.id %}" title="Сбросить авторизацию">
        <i class="material-icons">logout</i>
    </button>

    <button class="btn btn-outline-danger js-delete-promoter" data-nickname="{{ record.nickname }}"
            data-url="{% url 'promoter_app:promoter_delete' record.id %}" title="Удалить">
        <i class="material-icons">delete</i>
    </button>
</div>
