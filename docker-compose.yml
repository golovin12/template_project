x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  balancer:
    image: nginx:1.25
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_cache:/var/cache/nginx
      - static_volume:/staticfiles:ro
      - /var/log/nginx:/var/log/nginx
      - ./int/management/configurations/nginx_settings.conf:/etc/nginx/sites-enabled/nginx_settings.conf:ro
      - ./int/management/configurations/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - telegram_control
    networks:
      - loadbalancing

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: |
      /bin/sh -c '
      trap exit TERM;
      while :; do
        certbot renew --no-random-sleep-on-renew \
        --deploy-hook "python3 -c '\''
        import socket
        s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
        s.connect("/var/run/docker.sock")
        s.sendall(b\"POST /containers/balancer/kill?signal=HUP HTTP/1.1\\r\\nHost: v1.41\\r\\nContent-Length: 0\\r\\n\\r\\n\")
        s.close()
        '\''";
        sleep 12h & wait $${!};
      done'

  rabbitmq:
    image: rabbitmq:3.12.8-management
    command: rabbitmq-server
    restart: always
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - ./int/management/configurations/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./int/management/configurations/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    hostname: rabbitmq
    networks:
      - local_network
    expose:
      - 5672
    logging: *default-logging

  redis:
    image: redis:alpine
    command: redis-server --save 20 1 --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: always
    hostname: redis
    volumes:
      - redis:/var/lib/redis
    networks:
      - local_network
    expose:
      - 6379
    logging: *default-logging

  pgdb:
    image: postgres:17
    restart: always
    hostname: pgdb
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      - POSTGRES_DB=repair_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - /mnt/pgdbdata:/var/lib/postgresql/data/
      - ./int/management/configurations/postgresql.conf:/etc/postgresql/postgresql.conf
    networks:
      - local_network
    expose:
      - 5432
    logging: *default-logging

  web:
    build: .
    command: >
      bash -c "python manage.py create_databases
      && python manage.py migrate --database=default
      && python manage.py migrate --database=zone_1
      && python manage.py migrate --database=zone_2
      && python manage.py migrate --database=zone_3
      && echo yes | python manage.py collectstatic
      && uvicorn int.asgi_production:application --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      - DJANGO_SETTINGS_MODULE=int.settings_production
      - IS_WEB=true
    restart: always
    depends_on:
      - rabbitmq
      - redis
      - pgdb
    volumes:
      - static_volume:/staticfiles
    networks:
      - local_network
      - loadbalancing
    expose:
      - 8000
    deploy:
      replicas: 4
    logging: *default-logging

  scheduler:
    build: .
    command: python manage.py scheduler
    environment:
      - DJANGO_SETTINGS_MODULE=int.settings_production
    restart: always
    depends_on:
      - web
      - rabbitmq
      - redis
      - pgdb
    networks:
      - local_network
    logging: *default-logging

  worker:
    build: .
    command: python manage.py rundramatiq --processes 2 --threads 2 --queues holding_connection backup notifications statistics default promotreck
    environment:
      - DJANGO_SETTINGS_MODULE=int.settings_production
    restart: always
    depends_on:
      - web
      - rabbitmq
      - redis
      - pgdb
    networks:
      - local_network
    logging: *default-logging

  notifications_worker:
    build: .
    command: python manage.py rundramatiq --processes 1 --threads 2 --queues notifications_queue
    environment:
      - DJANGO_SETTINGS_MODULE=int.settings_production
    restart: always
    depends_on:
      - web
      - rabbitmq
      - redis
      - pgdb
    networks:
      - local_network
    logging: *default-logging

  telegram_control:
    build: ./telegram_control
    command: uvicorn app.main:app --host 0.0.0.0 --port 8050
    restart: always
    environment:
      - DOMAIN=int.atlantservice.space
    depends_on:
      - pgdb
    volumes:
      - ./int/management/envs:/telegram_control/envs:ro
    expose:
      - 8050
    networks:
      - local_network
      - loadbalancing
    logging: *default-logging

volumes:
  nginx_cache:
  static_volume:
  rabbitmq:
  redis:

networks:
  local_network:
  loadbalancing:
