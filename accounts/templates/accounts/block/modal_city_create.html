<div class="modal fade" id="cityCreateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-dark-blue">
                <h5 class="modal-title">Добавление города</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span class="text-white" aria-hidden="true">&times;</span></button>
            </div>
            <form method="post" autocomplete="off" id="cityCreate">
                {% csrf_token %}
                <div class="modal-body" id="cityCreateBody">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success action-btn">
                        <i class="material-icons align-bottom">check</i> Добавить город
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
